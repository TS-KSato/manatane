<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="t">
  <title id="t">壁の断面を中央に置いた図。壁の外側では電球の交換、プラグの抜き差し、露出型コンセントが資格なしでできる。壁の内側では壁の中を通る配線とコンセントの増設に資格が要る</title>
  <!-- 壁の断面(淡い塗り) -->
  <rect x="272" y="30" width="56" height="340" fill="#f1ead9"/>
  <g fill="none" stroke="#1f2a2e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- 壁の輪郭 -->
    <rect x="272" y="30" width="56" height="340"/>
    <!-- 天井と床 -->
    <path d="M30 340 H272 M328 340 H570"/>
    <!-- 壁の外: 電球の交換 -->
    <path d="M110 104 V132"/>
    <rect x="100" y="132" width="20" height="14" rx="2"/>
    <circle cx="110" cy="170" r="22"/>
    <path d="M102 176 L106 166 L110 176 L114 166 L118 176"/>
    <!-- 壁の外: 露出型コンセントとプラグの抜き差し -->
    <rect x="240" y="196" width="32" height="46" rx="3"/>
    <path d="M251 210 V224 M261 210 V224"/>
    <rect x="186" y="208" width="30" height="24" rx="3"/>
    <path d="M216 214 H240 M216 226 H240"/>
    <path d="M186 220 Q150 220 150 262"/>
    <!-- 壁の中: 壁の中を通る配線 -->
    <path d="M290 60 V330 M310 60 V330" stroke-dasharray="4 5"/>
    <!-- 壁の中: 新しいコンセントの増設(壁に穴と線) -->
    <path d="M310 234 H352" stroke-dasharray="4 5"/>
    <rect x="352" y="206" width="48" height="56" rx="3" stroke-dasharray="5 4"/>
    <rect x="361" y="212" width="30" height="44" rx="3"/>
    <path d="M371 226 V240 M381 226 V240"/>
    <circle cx="436" cy="196" r="14"/>
    <path d="M436 188 V204 M428 196 H444"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic UI', sans-serif" font-size="20" fill="#1f2a2e" text-anchor="middle">
    <text x="150" y="60">壁の外</text>
    <text x="150" y="86">資格は要らない</text>
    <text x="450" y="60">壁の中</text>
    <text x="450" y="86">資格が要る</text>
  </g>
</svg>
