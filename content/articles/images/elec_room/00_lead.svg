<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="t">
  <title id="t">部屋で椅子に座り、周りの照明・エアコン・冷蔵庫・スマートフォン・パソコンを見回している人</title>
  <rect x="0" y="300" width="600" height="100" fill="#f1ead9"/>
  <g fill="none" stroke="#1f2a2e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- 照明 -->
    <path d="M300 0 V58"/>
    <path d="M268 58 H332 L346 96 H254 Z"/>
    <circle cx="300" cy="108" r="11"/>
    <!-- エアコン -->
    <rect x="436" y="44" width="134" height="46" rx="8"/>
    <path d="M452 74 H554 M452 82 H554"/>
    <!-- 冷蔵庫 -->
    <rect x="48" y="118" width="92" height="192" rx="6"/>
    <path d="M48 186 H140"/>
    <path d="M126 140 V166 M126 204 V246"/>
    <!-- ノートパソコン -->
    <rect x="440" y="192" width="112" height="70" rx="4"/>
    <path d="M428 266 H564 L570 278 H422 Z"/>
    <!-- スマートフォン(充電中) -->
    <rect x="500" y="300" width="42" height="72" rx="7"/>
    <rect x="507" y="310" width="28" height="48" rx="2"/>
    <path d="M521 372 Q521 396 566 396"/>
    <!-- 椅子 -->
    <path d="M294 246 H348"/>
    <path d="M348 246 L354 184"/>
    <path d="M300 246 V300 M342 246 V300"/>
    <!-- 人(横向きに座って見回している) -->
    <circle cx="300" cy="166" r="18"/>
    <path d="M300 184 V246"/>
    <path d="M300 200 L268 236"/>
    <path d="M300 246 H254 V300 H238"/>
    <!-- 見回す動き -->
    <path d="M250 146 A56 56 0 0 1 350 146" stroke-dasharray="3 7"/>
    <path d="M343 142 L350 146 L346 153"/>
    <path d="M257 142 L250 146 L254 153"/>
  </g>
</svg>
