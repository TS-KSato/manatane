<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="t">
  <title id="t">消費者・小売・送配電・発電の四つの箱。お金は消費者から小売へ、小売から送配電(託送料金)と発電へ流れ、電気は発電から送配電を通って消費者へ流れる</title>
  <defs>
    <marker id="money" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#6fb1c4"/>
    </marker>
    <marker id="power" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#8bbf9f"/>
    </marker>
  </defs>
  <g fill="#f1ead9" stroke="#1f2a2e" stroke-width="2" stroke-linejoin="round">
    <rect x="40" y="170" width="110" height="60" rx="8"/>
    <rect x="245" y="60" width="110" height="60" rx="8"/>
    <rect x="245" y="280" width="110" height="60" rx="8"/>
    <rect x="450" y="170" width="110" height="60" rx="8"/>
  </g>
  <!-- お金の流れ -->
  <g fill="none" stroke="#6fb1c4" stroke-width="2.5" stroke-linecap="round" marker-end="url(#money)">
    <path d="M150 182 L243 100"/>
    <path d="M300 122 V276"/>
    <path d="M357 100 L450 182"/>
  </g>
  <!-- 電気の流れ -->
  <g fill="none" stroke="#8bbf9f" stroke-width="3.5" stroke-linecap="round" marker-end="url(#power)">
    <path d="M452 224 L360 306"/>
    <path d="M243 312 L152 224"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic UI', sans-serif" font-size="22" fill="#1f2a2e" text-anchor="middle">
    <text x="95" y="208">消費者</text>
    <text x="300" y="98">小売</text>
    <text x="300" y="318">送配電</text>
    <text x="505" y="208">発電</text>
  </g>
  <text x="312" y="204" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic UI', sans-serif" font-size="17" fill="#1f2a2e">託送料金</text>
  <!-- 凡例 -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic UI', sans-serif" font-size="17" fill="#1f2a2e">
    <path d="M40 372 H70" stroke="#6fb1c4" stroke-width="2.5" stroke-linecap="round"/>
    <text x="78" y="378">お金</text>
    <path d="M130 372 H160" stroke="#8bbf9f" stroke-width="3.5" stroke-linecap="round"/>
    <text x="168" y="378">電気</text>
  </g>
</svg>
