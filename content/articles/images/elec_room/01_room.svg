<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="t">
  <title id="t">部屋の中の家電五つとそのワット数の目安、壁の三箇所のコンセント、それぞれから分電盤の小さなスイッチへつながる線。ドライヤーと電子レンジは同じコンセントの線に集まっている</title>
  <!-- ドライヤーと電子レンジが集まる線の強調(淡い色) -->
  <g fill="none" stroke="#cfe6ee" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M230 262 L275 296"/>
    <path d="M322 250 L275 296"/>
    <path d="M275 318 V330 H509 V145"/>
  </g>
  <g fill="none" stroke="#1f2a2e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- 部屋の壁 -->
    <rect x="30" y="50" width="350" height="290"/>
    <!-- 照明 -->
    <path d="M205 50 V76"/>
    <path d="M182 76 H228 L238 100 H172 Z"/>
    <circle cx="205" cy="108" r="8"/>
    <!-- エアコン -->
    <rect x="280" y="62" width="90" height="32" rx="6"/>
    <path d="M292 82 H358 M292 88 H358"/>
    <!-- 冷蔵庫 -->
    <rect x="55" y="140" width="70" height="130" rx="5"/>
    <path d="M55 192 H125"/>
    <path d="M114 156 V178 M114 206 V236"/>
    <!-- 電子レンジ -->
    <rect x="190" y="210" width="80" height="50" rx="3"/>
    <rect x="198" y="218" width="48" height="34" rx="2"/>
    <path d="M256 224 V246"/>
    <!-- ドライヤー -->
    <rect x="296" y="214" width="46" height="26" rx="13"/>
    <path d="M296 227 H282"/>
    <path d="M312 240 L304 268"/>
    <!-- コンセント×3 -->
    <rect x="140" y="232" width="26" height="36" rx="3"/>
    <path d="M149 244 V256 M157 244 V256"/>
    <rect x="262" y="282" width="26" height="36" rx="3"/>
    <path d="M271 294 V306 M279 294 V306"/>
    <rect x="340" y="112" width="26" height="36" rx="3"/>
    <path d="M349 124 V136 M357 124 V136"/>
    <!-- 家電からコンセントへ -->
    <path d="M125 250 H140" stroke-width="1.5"/>
    <path d="M230 262 L275 296" stroke-width="1.5"/>
    <path d="M322 250 L275 296" stroke-width="1.5"/>
    <path d="M325 94 V102 H353 V112" stroke-width="1.5"/>
    <!-- 分電盤 -->
    <rect x="430" y="70" width="140" height="140" rx="4"/>
    <rect x="445" y="100" width="34" height="50" rx="3" fill="#cfe6ee"/>
    <rect x="495" y="105" width="8" height="40" rx="2"/>
    <rect x="509" y="105" width="8" height="40" rx="2"/>
    <rect x="523" y="105" width="8" height="40" rx="2"/>
    <rect x="537" y="105" width="8" height="40" rx="2"/>
    <rect x="551" y="105" width="8" height="40" rx="2"/>
    <!-- 外から入ってくる太い線 -->
    <path d="M462 100 V28" stroke-width="4"/>
    <!-- コンセント・照明から小さなスイッチへ -->
    <path d="M153 268 V318 H495 V145" stroke-width="1.5"/>
    <path d="M275 318 V330 H509 V145" stroke-width="1.5"/>
    <path d="M353 148 V160 H523 V145" stroke-width="1.5"/>
    <path d="M205 50 V38 H537 V105" stroke-width="1.5"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic UI', sans-serif" font-size="17" fill="#1f2a2e" text-anchor="middle">
    <text x="205" y="134">照明 60W</text>
    <text x="325" y="170">エアコン 700W</text>
    <text x="90" y="292">冷蔵庫 150W</text>
    <text x="222" y="284">電子レンジ 1300W</text>
    <text x="336" y="290">ドライヤー 1200W</text>
  </g>
  <text x="440" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic UI', sans-serif" font-size="20" fill="#1f2a2e">分電盤</text>
</svg>
