<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>寄り道のタネ 確認用 - マナタネ</title>
  <!-- 本体と同じスタイルを使う。本体の index.html からはリンクしない開発用ページ。 -->
  <link rel="stylesheet" href="../css/style.css">
  <style>
    /* 下部固定ナビを置かないので、その分の余白だけ打ち消す(本体の style.css は変更しない) */
    body { padding-bottom: 24px; }
    .dev-bar {
      font-size: 12px;
      color: var(--color-text-sub);
      padding: 6px 16px;
      background: var(--color-beige);
      border-bottom: 1px solid var(--color-border);
    }
    .dev-bar a { color: var(--color-text-sub); }
    /* &dev=1 のときだけ、内部リンクの直後に種類と ID を小さく添える */
    .dev-internal-tag {
      font-size: 11px;
      font-weight: 400;
      color: var(--color-text-sub);
      margin-left: 2px;
      white-space: nowrap;
    }
    .dev-list { margin: 0; padding-left: 20px; line-height: 1.8; }
    .dev-list small { color: var(--color-text-sub); }
  </style>
</head>
<body>
  <div class="app">
    <section class="screen" id="screen-article" data-screen="article">
      <div class="dev-bar" id="dev-bar" hidden>開発用の確認ページです。本体からはリンクされていません。<a href="article.html?dev=1" id="dev-bar-list">一覧へ</a></div>
      <header class="screen-header">
        <h2 class="screen-title" style="padding-right:0">寄り道のタネ</h2>
      </header>
      <div class="screen-body">
        <article class="article-card">
          <h1 class="article-title" id="article-title">読み込み中…</h1>
          <p class="article-verified" id="article-verified"></p>
          <div class="article-body" id="article-body"></div>
        </article>
      </div>
    </section>
  </div>

  <script src="../js/vendor/marked.umd.js"></script>
  <script>
  /* 本体 js/app.js の読み物表示(stripMemoSections / sanitizeArticleHtml / renderMarkdown)と
   * 同じ処理を複製している。本体側を変更したときは、ここも合わせて更新すること。
   * 違いは 1 点のみ: article:/guide:/route: の内部リンクを遷移させない(href を持たない a 要素にする)。
   * アドレスに &dev=1 が付いているときだけ、リンクの直後に種類と ID を小さく添え、開発用の帯を表示する。 */
  (function () {
    'use strict';
    const ARTICLES_JSON = '../data/articles.json';
    const PARAMS = new URLSearchParams(window.location.search);
    const DEV_MODE = PARAMS.get('dev') === '1';
    // 確認用: &today=YYYY-MM-DD が付いているときだけ、現在日付をその日として経過日数を判定する(本体にはない)
    const TODAY = (function () {
      const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(PARAMS.get('today') || '');
      return m ? new Date(+m[1], +m[2] - 1, +m[3]) : new Date();
    })();
    const ARTICLE_MEMO_PREFIX = '編集メモ';
    // 3: 画像は content/articles/ を基点に解決(このページは dev/ 配下なので ../ を付ける)
    const ARTICLE_IMAGE_BASE = '../content/articles/';
    const ARTICLE_IMAGE_RE = /^images\/[A-Za-z0-9_\-]+\/[A-Za-z0-9_\-]+\.(svg|png|jpg|jpeg|gif|webp)$/i;
    // 1: guide-image:{guide_id} は images/guides/{guide_id}.png(このページからは ../ 付き)
    const GUIDE_IMAGE_BASE = '../images/guides/';
    const GUIDE_IMAGE_RE = /^guide-image:([A-Za-z0-9_\-]+)$/;
    const ARTICLE_ALLOWED_TAGS = {
      h2: 1, h3: 1, p: 1, br: 1, hr: 1, strong: 1, em: 1, b: 1, i: 1, del: 1, code: 1, pre: 1,
      ul: 1, ol: 1, li: 1, blockquote: 1, a: 1,
      table: 1, thead: 1, tbody: 1, tr: 1, th: 1, td: 1,
    };

    function parseInternalTarget(url) {
      const m = /^(article|guide|route):([A-Za-z0-9_\-]+)$/.exec(String(url || '').trim());
      return m ? { kind: m[1], id: m[2] } : null;
    }

    // 1.4: 「編集メモ」で始まる見出しのセクションは表示しない(本体と同じ)
    function stripMemoSections(md) {
      const lines = String(md || '').split(/\r?\n/);
      const out = [];
      let skipLevel = 0;
      for (let i = 0; i < lines.length; i += 1) {
        const m = /^(#{1,6})\s*(.*?)\s*#*\s*$/.exec(lines[i]);
        if (m) {
          const level = m[1].length;
          if (skipLevel && level <= skipLevel) skipLevel = 0;
          if (!skipLevel && m[2].indexOf(ARTICLE_MEMO_PREFIX) === 0) { skipLevel = level; continue; }
        }
        if (!skipLevel) out.push(lines[i]);
      }
      return out.join('\n');
    }

    // 確認用: 内部リンクは href を持たない a 要素にして、本体と同じ見た目のまま遷移しないようにする。
    // &dev=1 のときだけ「テキスト [kind: id]」の添え字を付ける。
    function makeInternalPreview(target, srcNode, walk) {
      const a = document.createElement('a');
      a.className = 'article-link article-link--internal';
      walk(srcNode, a);
      if (DEV_MODE) {
        const tag = document.createElement('small');
        tag.className = 'dev-internal-tag';
        tag.textContent = ' [' + target.kind + ': ' + target.id + ']';
        a.appendChild(tag);
      }
      return a;
    }

    // 2: 外部リンクの直後に小さく「↗」を添える(本体と同じ)
    function makeExternalLinkIcon() {
      const s = document.createElement('span');
      s.className = 'article-link__icon';
      s.setAttribute('aria-hidden', 'true');
      s.textContent = '↗';
      return s;
    }

    // 1: guide-image:{guide_id} はガイド画像を、直後の段落の右に小さく回り込ませて表示する。
    // 画像が無い場合は placeholder.png にフォールバックする。
    function makeGuideImage(guideId, alt) {
      const img = document.createElement('img');
      img.className = 'article-guide-image';
      img.alt = alt || '';
      img.onerror = function () {
        if (img.src.indexOf('placeholder.png') === -1) { img.onerror = null; img.src = GUIDE_IMAGE_BASE + 'placeholder.png'; }
      };
      img.src = GUIDE_IMAGE_BASE + guideId + '.png';
      return img;
    }

    // guide-image だけを含む段落(<p><img></p>)は p で包まず、次の段落の右に回り込むようにする
    function isGuideImageOnlyParagraph(p) {
      let imgs = 0;
      for (let i = 0; i < p.childNodes.length; i += 1) {
        const c = p.childNodes[i];
        if (c.nodeType === Node.TEXT_NODE) { if (c.nodeValue.trim()) return false; continue; }
        if (c.nodeType !== Node.ELEMENT_NODE) continue;
        if (c.tagName.toLowerCase() === 'img' && GUIDE_IMAGE_RE.test(c.getAttribute('src') || '')) { imgs += 1; continue; }
        return false;
      }
      return imgs > 0;
    }

    // 1: verified_at を「YYYY年M月D日時点の情報をもとにしています。」にする(本体と同じ)
    function formatVerifiedAt(iso) {
      const v = parseIsoDate(iso);
      if (!v) return '';
      return v.y + '年' + v.m + '月' + v.d + '日時点の情報をもとにしています。';
    }

    // verified_at からの経過日数(端末の現在日付との差、日単位)。判定は表示時に行い、データは書き換えない。
    const VERIFIED_STALE_DAYS = 365; // これを超えたら、たしかめた日の一文に補足を続ける
    const VERIFIED_OLD_DAYS = 730;   // これを超えたら、各 h2 見出しの直前にも一行を置く
    function parseIsoDate(iso) {
      const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso || ''));
      return m ? { y: +m[1], m: +m[2], d: +m[3] } : null;
    }
    function daysSinceVerified(iso, today) {
      const v = parseIsoDate(iso);
      if (!v) return null;
      const t = today || new Date();
      return Math.floor((Date.UTC(t.getFullYear(), t.getMonth(), t.getDate()) - Date.UTC(v.y, v.m - 1, v.d)) / 86400000);
    }
    function formatVerifiedMonth(iso) {
      const v = parseIsoDate(iso);
      return v ? v.y + '年' + v.m + '月' : '';
    }
    // 「YYYY年M月D日時点の情報をもとにしています。」+ 365日超なら補足の一文(同じ書式で続ける)
    function verifiedInfoText(iso, today) {
      const base = formatVerifiedAt(iso);
      if (!base) return '';
      const days = daysSinceVerified(iso, today);
      if (days !== null && days > VERIFIED_STALE_DAYS) {
        return base + 'その後、制度や数字が変わっている場合があります。最新の情報は、文末の「この話のもと」からたしかめられます。';
      }
      return base;
    }
    // 730日超なら、本文の各 h2 見出しの直前に小さな一行を置く
    function insertSectionNotes(bodyEl, iso, today) {
      const days = daysSinceVerified(iso, today);
      if (days === null || days <= VERIFIED_OLD_DAYS) return;
      const text = 'この節は、' + formatVerifiedMonth(iso) + '時点の制度や数字にもとづいています。';
      Array.prototype.forEach.call(bodyEl.querySelectorAll('h2'), h => {
        const p = document.createElement('p');
        p.className = 'article-section-note';
        p.textContent = text;
        h.parentNode.insertBefore(p, h);
      });
    }

    function applyExternalLink(el, href) {
      if (/^https?:\/\//i.test(href)) {
        el.href = href;
        el.target = '_blank';
        el.rel = 'noopener noreferrer';
        el.className = 'article-link article-link--external';
        return true;
      }
      return false;
    }

    // 4: 変換後の HTML を許可タグだけで組み直す(本体と同じ。内部リンクの扱いのみ確認用に変更)
    function sanitizeArticleHtml(html) {
      const doc = new DOMParser().parseFromString('<!doctype html><body>' + html, 'text/html');
      const frag = document.createDocumentFragment();
      function walk(src, dst) {
        Array.prototype.forEach.call(src.childNodes, node => {
          if (node.nodeType === Node.TEXT_NODE) { dst.appendChild(document.createTextNode(node.nodeValue)); return; }
          if (node.nodeType !== Node.ELEMENT_NODE) return;
          let tag = node.tagName.toLowerCase();
          if (tag === 'h1' || tag === 'script' || tag === 'style' || tag === 'iframe' ||
              tag === 'object' || tag === 'embed' || tag === 'form' || tag === 'input' || tag === 'button') return;
          if (tag === 'h4' || tag === 'h5' || tag === 'h6') tag = 'h3';
          if (tag === 'p' && isGuideImageOnlyParagraph(node)) { walk(node, dst); return; }
          if (tag === 'img') {
            const src = node.getAttribute('src') || '';
            const alt = node.getAttribute('alt') || '';
            const gm = GUIDE_IMAGE_RE.exec(src);
            if (gm) { dst.appendChild(makeGuideImage(gm[1], alt)); return; }
            if (!ARTICLE_IMAGE_RE.test(src)) return;
            const img = document.createElement('img');
            img.src = ARTICLE_IMAGE_BASE + src;
            img.alt = alt;
            dst.appendChild(img);
            return;
          }
          if (!ARTICLE_ALLOWED_TAGS[tag]) { walk(node, dst); return; }
          if (tag === 'a') {
            const href = node.getAttribute('href') || '';
            const internal = parseInternalTarget(href);
            if (internal) { dst.appendChild(makeInternalPreview(internal, node, walk)); return; }
            const a = document.createElement('a');
            if (!applyExternalLink(a, href)) { walk(node, dst); return; }
            walk(node, a);
            a.appendChild(makeExternalLinkIcon());
            dst.appendChild(a);
            return;
          }
          const el = document.createElement(tag);
          walk(node, el);
          dst.appendChild(el);
        });
      }
      walk(doc.body, frag);
      return frag;
    }

    function renderMarkdown(md) {
      const src = stripMemoSections(md);
      if (window.marked && typeof window.marked.parse === 'function') {
        return sanitizeArticleHtml(window.marked.parse(src, { gfm: true, breaks: false }));
      }
      const frag = document.createDocumentFragment();
      src.split(/\n{2,}/).forEach(para => {
        const p = document.createElement('p');
        p.textContent = para;
        frag.appendChild(p);
      });
      return frag;
    }

    // ---- ページ固有の処理 ----
    const titleEl = document.getElementById('article-title');
    const verifiedEl = document.getElementById('article-verified');
    const bodyEl = document.getElementById('article-body');

    function showMessage(text) {
      bodyEl.innerHTML = '';
      const p = document.createElement('p');
      p.className = 'desc';
      p.textContent = text;
      bodyEl.appendChild(p);
    }

    function showList(articles, note) {
      titleEl.textContent = '寄り道のタネの一覧';
      verifiedEl.textContent = note || '';
      bodyEl.innerHTML = '';
      if (!articles.length) { showMessage('articles.json に寄り道のタネがありません。'); return; }
      const ul = document.createElement('ul');
      ul.className = 'dev-list';
      articles.forEach(a => {
        const li = document.createElement('li');
        const link = document.createElement('a');
        link.href = 'article.html?id=' + encodeURIComponent(a.article_id) + (DEV_MODE ? '&dev=1' : '');
        link.textContent = a.title || a.article_id;
        li.appendChild(link);
        const meta = document.createElement('small');
        meta.textContent = ' (' + a.article_id + ' / ' + (a.role || '') + ' / ' + (a.verified_at || '') + ')';
        li.appendChild(meta);
        ul.appendChild(li);
      });
      bodyEl.appendChild(ul);
    }

    function showArticle(a) {
      document.title = (a.title || a.article_id) + ' - 寄り道のタネ 確認用';
      titleEl.textContent = a.title || '';
      verifiedEl.textContent = verifiedInfoText(a.verified_at, TODAY);
      showMessage('読み込み中…');
      return fetch('../' + a.file, { cache: 'no-cache' }).then(r => {
        if (!r.ok) throw new Error('HTTP ' + r.status + ' for ' + a.file);
        return r.text();
      }).then(md => {
        bodyEl.innerHTML = '';
        bodyEl.appendChild(renderMarkdown(md));
        insertSectionNotes(bodyEl, a.verified_at, TODAY);
      });
    }

    const id = PARAMS.get('id');
    const devBar = document.getElementById('dev-bar');
    if (devBar) devBar.hidden = !DEV_MODE;
    fetch(ARTICLES_JSON, { cache: 'no-cache' }).then(r => {
      if (!r.ok) throw new Error('HTTP ' + r.status + ' for ' + ARTICLES_JSON);
      return r.json();
    }).then(articles => {
      const list = Array.isArray(articles) ? articles : [];
      if (!id) { showList(list, ''); return; }
      const a = list.filter(x => x.article_id === id)[0];
      if (!a) { showList(list, 'id「' + id + '」は articles.json にありません。'); return; }
      return showArticle(a);
    }).catch(err => {
      console.error('[dev/article] load failed:', err);
      titleEl.textContent = '読み込みエラー';
      verifiedEl.textContent = '';
      showMessage('読み込みに失敗しました: ' + err.message);
    });
  })();
  </script>
</body>
</html>
